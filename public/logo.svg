<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Slate Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="45%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Metallic Gold Outer Gradient -->
    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="30%" stop-color="#f59e0b"/>
      <stop offset="70%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>

    <!-- Blade Chrome/Gold Gradient -->
    <linearGradient id="bladeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#fef08a"/>
      <stop offset="70%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>

    <!-- Chevrons / Wings Gradient -->
    <linearGradient id="wingGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="40%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fef08a"/>
    </linearGradient>

    <!-- Center Radial Glow -->
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.3"/>
      <stop offset="60%" stop-color="#f59e0b" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.6"/>
      <feDropShadow dx="0" dy="0" stdDeviation="16" flood-color="#f59e0b" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Canvas Background for App Icons -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>

  <!-- Subtle Border Accent -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="url(#goldBorder)" stroke-width="3" stroke-opacity="0.35"/>

  <!-- Radial Golden Glow Behind Shield -->
  <circle cx="256" cy="256" r="210" fill="url(#centerGlow)"/>

  <!-- Shield & Sword Emblem -->
  <g filter="url(#shadow)">
    <!-- Outer Shield Frame -->
    <path d="M 256 60 C 345 60 415 82 430 125 C 430 270 365 385 256 455 C 147 385 82 270 82 125 C 97 82 167 60 256 60 Z"
          fill="#0f172a" stroke="url(#goldBorder)" stroke-width="12" stroke-linejoin="round"/>

    <!-- Inner Shield Surface -->
    <path d="M 256 82 C 330 82 390 100 402 135 C 402 255 350 355 256 422 C 162 355 110 255 110 135 C 122 100 182 82 256 82 Z"
          fill="#090d16" stroke="#f59e0b" stroke-width="2.5" stroke-opacity="0.4"/>

    <!-- Upward LevelUp Chevron Wings -->
    <!-- Lower Chevron -->
    <path d="M 166 312 L 256 242 L 346 312 L 322 340 L 256 288 L 190 340 Z" fill="url(#wingGrad)" opacity="0.8"/>
    <!-- Upper Chevron -->
    <path d="M 182 252 L 256 194 L 330 252 L 310 278 L 256 234 L 202 278 Z" fill="url(#wingGrad)"/>

    <!-- Sword Blade (Pointing Upward) -->
    <!-- Right Blade Facet -->
    <path d="M 256 100 L 272 268 L 256 282 Z" fill="url(#bladeGrad)"/>
    <!-- Left Blade Facet -->
    <path d="M 256 100 L 256 282 L 240 268 Z" fill="#ffffff" opacity="0.85"/>

    <!-- Crossguard -->
    <path d="M 205 272 C 225 272 242 266 256 274 C 270 266 287 272 307 272 C 314 280 306 290 294 290 L 218 290 C 206 290 198 280 205 272 Z"
          fill="url(#goldBorder)" stroke="#78350f" stroke-width="1.5"/>

    <!-- Sword Grip -->
    <rect x="250" y="290" width="12" height="34" rx="2" fill="#e2e8f0"/>
    <line x1="250" y1="298" x2="262" y2="298" stroke="#475569" stroke-width="1.5"/>
    <line x1="250" y1="306" x2="262" y2="306" stroke="#475569" stroke-width="1.5"/>
    <line x1="250" y1="314" x2="262" y2="314" stroke="#475569" stroke-width="1.5"/>

    <!-- Pommel with Inset Ruby / Amber Gem -->
    <circle cx="256" cy="336" r="11" fill="url(#goldBorder)"/>
    <circle cx="256" cy="336" r="5.5" fill="#ef4444"/>

    <!-- Gleaming Star of Excellence at Tip -->
    <polygon points="256,76 261,94 278,98 263,106 266,124 256,112 246,124 249,106 234,98 251,94" fill="#ffffff"/>
    <circle cx="256" cy="100" r="3" fill="#fef08a"/>
  </g>
</svg>
