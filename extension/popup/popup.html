<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LevelUp — Khiên Chặn Xao Nhãng</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>

  <div class="popup-container">
    <!-- Header -->
    <header class="popup-header">
      <div class="header-brand">
        <img src="../icons/icon-48.png" alt="LevelUp Logo" class="brand-avatar">
        <div class="brand-text">
          <h1 id="header-brand-title" class="brand-title">LevelUp <span class="highlight">Khiên Bảo Vệ</span></h1>
          <span id="header-brand-subtitle" class="brand-subtitle">Focus Shield <span class="version-tag">v1.6.0</span></span>
        </div>
      </div>
    </header>

    <!-- =========================================================================
         MAIN SHIELD VIEW
         ========================================================================= -->
    <main id="view-shield" class="view-panel active">
      <!-- Status Card -->
      <section id="status-card" class="status-card status-idle">
        <div class="status-header">
          <span class="status-label">TRẠNG THÁI KHIÊN</span>
          <div id="status-badge" class="badge-status">
            <span class="badge-dot"></span>
            <span class="badge-text">Nghỉ Ngơi</span>
          </div>
        </div>

        <!-- Active Quest HUD (visible when running) -->
        <div id="quest-hud" class="quest-hud hidden">
          <div class="quest-info">
            <div id="popup-quest-icon" class="quest-icon">📖</div>
            <div class="quest-meta">
              <div id="popup-quest-title" class="quest-title">Đọc 1 chương sách</div>
              <div id="popup-quest-reward" class="quest-reward">+12 Vàng</div>
            </div>
          </div>

          <div class="timer-row">
            <span class="timer-label">Thời gian còn lại:</span>
            <span id="popup-countdown" class="timer-countdown">25:00</span>
          </div>

          <button id="btn-restore-capsule" class="btn-restore-capsule" type="button" title="Hiển thị lại đồng hồ mini trên các trang web nếu bạn đã bấm ẩn">
            👁️ Hiện Lại Đồng Hồ Mini
          </button>
        </div>

        <!-- Mini Capsule HUD Switch -->
        <div class="switch-row">
          <span class="switch-label">⏱️ Đồng Hồ Nổi Mini (HUD)</span>
          <label class="switch-control">
            <input type="checkbox" id="mascot-toggle">
            <span class="slider"></span>
          </label>
        </div>

        <!-- Manual Shield Switch -->
        <div class="switch-row">
          <span class="switch-label">Bật Khiên Thủ Công</span>
          <label class="switch-control">
            <input type="checkbox" id="shield-toggle">
            <span class="slider"></span>
          </label>
        </div>

        <!-- Test Fireworks Button -->
        <button id="btn-test-fireworks" class="btn-restore-capsule" type="button" style="margin-top: 6px; border-color: rgba(245, 158, 11, 0.4); color: #fbbf24;" title="Kích hoạt hiệu ứng pháo hoa 8-bit ăn mừng trên tab đang mở">
          🎆 Xem Thử Hiệu Ứng Pháo Hoa
        </button>
      </section>

      <!-- Quick Add Domain -->
      <section class="quick-add-section">
        <label class="section-label" for="input-quick-domain">CHẶN NHANH TRANG WEB</label>
        <form id="form-quick-add" class="add-form">
          <input type="text" id="input-quick-domain" placeholder="vd: youtube.com" class="input-domain" autocomplete="off" spellcheck="false">
          <button type="submit" class="btn-add" title="Thêm vào danh sách">
            + Thêm
          </button>
        </form>
      </section>

      <!-- Popular Presets (Chips) -->
      <section class="chips-section">
        <div class="section-label-row">
          <span class="section-label">DANH SÁCH CHẶN</span>
          <span id="chips-count" class="chips-count">0</span>
        </div>
        <div id="blacklist-chips" class="chips-container">
          <!-- Chips inserted by JS -->
        </div>
      </section>

      <!-- Bottom CTA: Actions -->
      <div style="display: flex; gap: 8px; margin-top: 10px;">
        <button id="btn-open-options" type="button" class="btn-secondary-cta" style="flex: 1;" title="Cài đặt danh sách chặn nâng cao">
          <span>⚙️ Tùy Chọn Thêm</span>
        </button>
        <button id="btn-open-levelup" type="button" class="btn-primary-cta" style="flex: 1;" title="Quay về LevelUp">
          <span>⚔️ Vào LevelUp</span>
        </button>
      </div>

      <!-- Footer Info -->
      <footer class="popup-footer">
        <div class="footer-left">
          🛡️ Đã chặn: <strong id="popup-blocked-count" class="blocked-count-val">0</strong> lần
        </div>
        <div class="footer-right">
          ⚡ Pomodoro Auto-Sync
        </div>
      </footer>
    </main>
  </div>

  <script src="popup.js"></script>
</body>
</html>
